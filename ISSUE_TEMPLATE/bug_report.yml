name: Bug report
description: Something does not work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Security problems must not be reported here — see SECURITY.md.
        Please redact API keys, tokens and private file contents from everything you paste.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. …
        2. …
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: The release, build number or commit you were running.
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform
      placeholder: macOS 26 arm64 · iOS 26 on iPhone 17 · Ubuntu 24.04
  - type: textarea
    id: logs
    attributes:
      label: Logs
      render: text
